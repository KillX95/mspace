<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarianSpace Data</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        <div class="header-top">
            <div class="brand">
                <i class="fa-solid fa-table"></i>
                <span>MarianSpace Data</span>
            </div>
            <input type="text" id="workbookName" class="workbook-name" value="Untitled workbook" spellcheck="false">
        </div>
        <div class="header-actions">
            <button class="btn" id="newBtn" title="New workbook">
                <i class="fa-solid fa-file"></i> New
            </button>
            <button class="btn" id="saveMwbBtn" title="Save as .mwb">
                <i class="fa-solid fa-floppy-disk"></i> Save (.mwb)
            </button>
            <button class="btn" id="loadMwbBtn" title="Load a .mwb file">
                <i class="fa-solid fa-folder-open"></i> Load (.mwb)
            </button>
            <input type="file" id="mwbInput" accept=".mwb,application/json" hidden>
            <button class="btn" id="addRowBtn" title="Add row">
                <i class="fa-solid fa-plus"></i> Row
            </button>
            <button class="btn" id="addColBtn" title="Add column">
                <i class="fa-solid fa-plus"></i> Column
            </button>
            <button class="btn" id="delRowBtn" title="Delete last row">
                <i class="fa-solid fa-minus"></i> Row
            </button>
            <button class="btn" id="delColBtn" title="Delete last column">
                <i class="fa-solid fa-minus"></i> Column
            </button>
            <button class="btn" id="exportCsvBtn" title="Export to CSV">
                <i class="fa-solid fa-file-csv"></i> CSV
            </button>
            <button class="btn" id="printBtn" title="Print">
                <i class="fa-solid fa-print"></i> Print
            </button>
        </div>
    </header>

    <div class="formula-bar">
        <div class="name-box" id="nameBox">A1</div>
        <div class="fx-label">fx</div>
        <input type="text" id="formulaInput" class="formula-input" spellcheck="false" placeholder="Value or formula (e.g., =A1+B2)">
    </div>

    <div class="toolbar">
        <div class="toolbar-group">
            <button class="tool-btn" id="boldBtn" title="Bold"><i class="fa-solid fa-bold"></i></button>
            <button class="tool-btn" id="italicBtn" title="Italic"><i class="fa-solid fa-italic"></i></button>
            <button class="tool-btn" id="underlineBtn" title="Underline"><i class="fa-solid fa-underline"></i></button>
        </div>
        <div class="toolbar-separator"></div>
        <div class="toolbar-group">
            <button class="tool-btn" data-align="left" title="Align left"><i class="fa-solid fa-align-left"></i></button>
            <button class="tool-btn" data-align="center" title="Align center"><i class="fa-solid fa-align-center"></i></button>
            <button class="tool-btn" data-align="right" title="Align right"><i class="fa-solid fa-align-right"></i></button>
        </div>
        <div class="toolbar-separator"></div>
        <div class="toolbar-group">
            <button class="tool-btn" id="sumBtn" title="Sum of selection"><i class="fa-solid fa-calculator"></i> SUM</button>
            <button class="tool-btn" id="avgBtn" title="Average of selection"><i class="fa-solid fa-chart-simple"></i> AVERAGE</button>
            <button class="tool-btn" id="clearFmtBtn" title="Clear formatting"><i class="fa-solid fa-eraser"></i></button>
        </div>
    </div>

    <main class="sheet-container">
        <div class="sheet-wrapper">
            <table class="sheet" id="sheet"></table>
        </div>
    </main>

    <footer class="status-bar">
        <div class="status-left">
            <span id="selectionInfo">No selection</span>
        </div>
        <div class="status-right">
            <span>MarianSpace Data • .mwb</span>
        </div>
    </footer>

    <div id="toast" class="toast"></div>

    <script src="app.js"></script>
</body>
</html>
